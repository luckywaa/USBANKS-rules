name: Sync clash ruleset

on:
  push:
    paths:
      - 'Clash/*.list'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Process .list changes and generate .yaml
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD -- 'Clash/*.list' || true)
          echo "Changed files: $CHANGED_FILES"

          for f in $CHANGED_FILES; do
            BASENAME=$(basename "$f" .list)
            PROVIDERS_DIR="Clash/Providers"
            RULESET_DIR="$PROVIDERS_DIR/Ruleset"

            mkdir -p "$PROVIDERS_DIR" "$RULESET_DIR"

            if [ -f "$f" ]; then
              echo "Processing add/modify: $f"
              for target in "$PROVIDERS_DIR/${BASENAME}.yaml" "$RULESET_DIR/${BASENAME}.yaml"; do
                echo "payload:" > "$target"
                awk '
                # 注释行：去除原先行首空白，统一缩进两个空格
                /^[[:space:]]*#/ {
                  sub(/^[[:space:]]*/, "")
                  print "  " $0
                  next
                }
                # 空行直接跳过
                /^[[:space:]]*$/ { next }
                # 规则行：转为 YAML list 项
                { print "  - " $0 }
                ' "$f" >> "$target"
              done
            else
              echo "Processing delete: $f"
              rm -f "$PROVIDERS_DIR/${BASENAME}.yaml"
              rm -f "$RULESET_DIR/${BASENAME}.yaml"
            fi
          done

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Clash/Providers/ Clash/Providers/Ruleset/
          git diff --cached --quiet || git commit -m "Auto sync .yaml from Clash/*.list changes" && git push
