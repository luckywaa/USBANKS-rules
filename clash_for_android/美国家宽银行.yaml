    proxies:
      - 🇨🇳 本地直连
      - 总模式
      - 延迟最低
      - 故障转移
      - 负载均衡
      - 手动选择
      - 美国节点
      - 香港节点
      - 狮城节点
      - 日本节点
      - 台湾节点
      - ⛔ 拒绝连接
app_groups: &app_groups
    type: select
    proxies:
      - 总模式
      - 延迟最低
      - 故障转移
      - 负载均衡
